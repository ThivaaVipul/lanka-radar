name: lanka_radar
description: Tells you when Sri Lankan official sources publish something new.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/albert_sans/OFL.txt
    - assets/holidays_ta.json
  fonts:
    - family: Albert Sans
      fonts:
        - asset: assets/fonts/albert_sans/AlbertSans-Regular.ttf
        - asset: assets/fonts/albert_sans/AlbertSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/albert_sans/AlbertSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/albert_sans/AlbertSans-Bold.ttf
          weight: 700

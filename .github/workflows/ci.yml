name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every workflow pins ubuntu-24.04. Moving to a newer image is its own change,
# tested first, so a new image never breaks a build by surprise.
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The oldest supported version, so newer-only syntax fails here.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/pyproject.toml

      - run: pip install -e "scrapers[dev]"
      # So the OCR test reads the saved Litro image instead of being skipped.
      - name: Install Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: ruff format --check .
      - run: ruff check .
      - name: Scraper tests
        run: pytest scrapers
      - name: Release tooling tests
        run: pytest scripts/release

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle # dependencies and the Gradle wrapper, keyed on the *.gradle* files

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

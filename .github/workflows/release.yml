# Publishes a release automatically on every push to main that ships a change.
#
# Versions follow Conventional Commits since the last release tag:
#   fix / perf / revert -> patch (0.1.1), feat -> minor (0.2.0),
#   "feat!:" or "BREAKING CHANGE:" -> major (1.0.0).
# Other types (docs, chore, ci, test, refactor, style, build) don't release.
# The first release uses the version in app/pubspec.yaml once there is a change
# to ship, and a pubspec version above the computed one wins.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      build-number: ${{ steps.next.outputs.build_number }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - id: next
        run: python scripts/release/next_release.py

      # Every release must be signed with the same key, so without it a due
      # release is skipped with a warning instead of failing the run.
      - id: gate
        env:
          DUE: ${{ steps.next.outputs.release }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$DUE" = "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::warning::A release is due, but the signing key secrets are missing (README, Releases)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=$DUE" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Check and build
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Release notes
        run: python scripts/release/next_release.py && cat release-notes.md

      - name: Checksums
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/lanka-radar-$VERSION.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Lanka Radar $tag" --notes-file release-notes.md
          fi
